name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout v4 tag resolved via GitHub API on 2026-11-14.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +stable fmt --check
      - name: Test
        run: cargo +stable test --locked
      - name: Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

# This workflow does not approve Issues/ADRs, edit labels, merge PRs, or deploy.
# For other stacks, replace this job with the repository's documented checks.
