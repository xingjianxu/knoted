name: 修复缺陷
description: 描述实际行为、预期行为和复现条件
type: Bug
body:
  - type: textarea
    id: goal
    attributes:
      label: 交付目标
      description: 用一句话写出本次能独立验收的结果。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与直接前置
      description: 标明受影响模块、相关文档或 ADR 及依赖的 Issue。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 列出下一位开发者可以复现或执行的具体步骤；请勿包含凭据或敏感信息。
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: 完成条件
      description: 给出输入、观察方法及预期结果，包含必要的失败场景与回归测试。
    validations:
      required: true
