name: 功能需求
description: 说明需要解决的问题、用户价值、范围与验收标准。
title: "[Feature] "
labels: [feature, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        请先检查重复需求。创建需求不表示批准实施；重要架构选择另行评审。
        Agent 使用 gh 时显式设置 agent-found、needs-triage，不根据表单自动推断批准状态。
  - type: dropdown
    id: source
    attributes:
      label: 问题来源
      options: [人工报告, Agent 发现]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 背景与要解决的问题
      description: 描述使用场景、现有困难及用户价值。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
      description: 描述用户可以完成什么，不强制限定具体技术实现。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 影响范围与不包含的内容
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
      description: 用检查清单覆盖正常场景、边界和兼容要求。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方向、查重结果和相关 Issue / RFC / ADR
      description: 可附建议与已有讨论，尚未确认的方案明确标为提案。
