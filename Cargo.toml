[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

serde_json = "1"
tempfile = "3"
sha2 = "0.10"
url = "2"
rand = "0.8"
base64 = "0.22"
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation"] }

# HTTP client for the internal Python protocol. `default-features = false`
# keeps the OpenSSL-based native-tls backend out of the build; rustls is the
# only TLS implementation the workspace links.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }

axum = { version = "0.8", features = [
    "json",
    "http1",
    "tokio",
    "tracing",
    "matched-path",
    "original-uri",
    "query",
    "form",
] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
    "json",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
