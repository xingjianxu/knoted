[project]
name = "knoted-intelligence"
version = "0.1.0"
description = "Internal parse and embed execution service for Knoted"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.32",
]

[project.scripts]
knoted-intelligence = "knoted_intelligence.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knoted_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
