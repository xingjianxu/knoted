[project]
name = "knoted-intelligence"
version = "0.1.0"
description = "Internal parse and embed execution service for Knoted"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # T10 parsing stack: every version and model revision is pinned in
    # src/knoted_intelligence/parsing/LOCK.md; `docling` and `rapidocr` must
    # match the layout of the locally provisioned artifacts.
    "docling==2.150.1",
    "docling-ibm-models==4.0.4",
    "fastapi>=0.115",
    # RapidOCR's onnxruntime backend is not a transitive dependency of docling.
    "onnxruntime==1.32.0",
    "pydantic>=2.9",
    "rapidocr==3.10.0",
    # T11 dense embedding stack: pinned in embedding/LOCK.md. safetensors is the
    # snapshot's weight format (the upstream bin was converted losslessly).
    "safetensors==0.8.0",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "transformers==5.23.0",
    "uvicorn>=0.32",
]

[project.scripts]
knoted-intelligence = "knoted_intelligence.app:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knoted_intelligence"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
