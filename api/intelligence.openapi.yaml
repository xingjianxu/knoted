openapi: 3.1.0
info:
  title: Knoted Intelligence Internal API
  version: 1.0.0
  description: Rust worker 与 Python 智能服务之间的 HTTP 内部契约。仅监听 127.0.0.1:15603；状态持久到专用 SQLite 执行账本，不是业务数据库。
servers:
  - url: http://127.0.0.1:15603
tags:
  - name: Executions
    description: 解析与嵌入执行。
  - name: Health
    description: 内部服务健康。
paths:
  /internal/v1/executions:
    post:
      tags:
        - Executions
      summary: 创建解析或嵌入执行
      operationId: createExecution
      description: 相同 execution_id 与输入摘要重复提交时返回原记录且不重复计算；参数不同返回 409。受控对象 ID 不能包含路径分隔，拒绝网络 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutionRequest"
      responses:
        "200":
          description: 相同 execution_id 与输入摘要已存在，返回原记录。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "201":
          description: 已创建执行。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/v1/executions/{executionId}:
    get:
      tags:
        - Executions
      summary: 读取执行状态
      operationId: getExecution
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/v1/executions/{executionId}/cancel:
    post:
      tags:
        - Executions
      summary: 请求取消执行
      operationId: cancelExecution
      description: 收到取消后杀掉可取消子进程组并确认退出才释放槽；已终态返回 409。重复取消幂等。
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/v1/executions/{executionId}/result:
    get:
      tags:
        - Executions
      summary: 读取执行结果清单
      operationId: getExecutionResult
      description: 结果保存在 staging；对象清单与摘要由 Rust 验证后才发布。未完成返回 409，失败返回 422。
      parameters:
        - $ref: "#/components/parameters/ExecutionId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /internal/v1/health:
    get:
      tags:
        - Health
      summary: 读取内部服务健康状态
      operationId: getIntelligenceHealth
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          minLength: 1
          description: 稳定错误码；客户端按 code 分支，不解析 message。
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          format: uuid
        field_errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldError"
        current_version:
          type: integer
          minimum: 1
          description: 409 版本冲突时返回的当前版本。
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    ExecutionKind:
      type: string
      enum:
        - parse
        - embed
    ExecutionState:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancel_requested
        - cancelled
        - interrupted
      description: interrupted 为可重试终态；由 Rust 创建新 execution_id，不能把同 ID 视为仍在运行。
    ExecutionRequest:
      type: object
      additionalProperties: false
      required:
        - execution_id
        - kind
        - input_object_id
        - input_sha256
        - source_version
        - deadline
        - options_revision
      properties:
        execution_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ExecutionKind"
        input_object_id:
          type: string
          pattern: ^(?!\.\.?$)[A-Za-z0-9._-]+$
          description: 受控对象 ID，不含路径分隔符；拒绝网络 URL。
        input_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_version:
          type: integer
          minimum: 0
        deadline:
          type: string
          format: date-time
        options_revision:
          type: string
          minLength: 1
    ExecutionRecord:
      type: object
      additionalProperties: false
      required:
        - execution_id
        - kind
        - state
        - input_sha256
        - source_version
        - options_revision
        - created_at
        - updated_at
        - started_at
        - finished_at
        - error
      allOf:
        - if:
            required: [compute_exit_confirmed]
            properties:
              compute_exit_confirmed:
                const: true
          then:
            properties:
              state:
                enum: [succeeded, failed, cancelled, interrupted]
      properties:
        execution_id:
          type: string
          format: uuid
        compute_exit_confirmed:
          type: boolean
          default: false
          description: >-
            仅 terminal 可为 true，表示此 ID 不会再启动计算且整个受监督后代树已确认回收。
            缺失按 false；旧记录不得因 PID 不存在或升级自动补 true。证明可单调补齐，
            不改写终态业务结果。资源确认另须匹配 request echo，成功还须完整产物、deadline
            与来源/租约栅栏。新 Rust/Python 同固定版本部署，见 ADR0007。
        kind:
          $ref: "#/components/schemas/ExecutionKind"
        state:
          $ref: "#/components/schemas/ExecutionState"
        input_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        source_version:
          type: integer
          minimum: 0
        options_revision:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        finished_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        error:
          anyOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    ExecutionResult:
      type: object
      additionalProperties: false
      required:
        - object_id
        - sha256
        - size
        - media_type
      properties:
        object_id:
          type: string
          pattern: ^(?!\.\.?$)[A-Za-z0-9._-]+$
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size:
          type: integer
          format: int64
          minimum: 0
        media_type:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - active_executions
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        active_executions:
          type: integer
          minimum: 0
  parameters:
    ExecutionId:
      name: executionId
      in: path
      required: true
      description: 执行 ID。
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求语法或参数无效。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 对象不存在。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 版本或状态冲突；version 冲突时带 current_version。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: 业务字段无效，详见 field_errors。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: 依赖不可用。
      headers:
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
