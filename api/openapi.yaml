        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TagCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
    TagUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
        - name
      properties:
        expected_version:
