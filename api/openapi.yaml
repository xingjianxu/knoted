        - title
        - description
        - version
        - archived_at
        - deleted_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 500
        description:
          type:
            - string
            - "null"
        version:
          type: integer
          minimum: 1
        archived_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type:
            - string
            - "null"
    ProjectUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      minProperties: 2
      properties:
        expected_version:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type:
            - string
            - "null"
    ProjectPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        next_cursor:
          type:
            - string
