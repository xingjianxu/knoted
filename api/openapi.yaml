                $ref: "#/components/schemas/ChatPostMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/runs/{runId}:
    get:
      tags:
        - Chat
      summary: 读取生成运行状态
      operationId: getChatRun
      description: 断连客户端用此接口查询状态，不自动重发生成。
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/runs/{runId}/events:
    post:
      tags:
        - Chat
      summary: 流式读取生成事件
      operationId: streamChatRunEvents
      description: SSE 事件类型为 queued/started/delta/citation/completed/failed/cancelled；每条含 run_id 与递增 seq。响应体每行是 ChatEvent JSON。
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 成功
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 事件流。
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/runs/{runId}/cancel:
    post:
      tags:
        - Chat
      summary: 取消生成运行
      operationId: cancelChatRun
      description: 显式取消；断连不会隐式增加任务。失败/取消保留 partial 标记。
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/runs/{runId}/retry:
    post:
      tags:
        - Chat
      summary: 重试生成运行
      operationId: retryChatRun
      description: 创建新的 run，不把 interrupted/断流视为成功。
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/messages/{messageId}/citations:
    get:
      tags:
        - Chat
      summary: 列出回答引用
      operationId: listChatMessageCitations
      description: 固定快照与当前来源状态；来源删除后历史页面仍展示快照并提示。
      parameters:
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /chat/messages/{messageId}/save-note:
    post:
      tags:
        - Chat
      summary: 将回答保存为独立笔记
      operationId: saveChatMessageAsNote
      description: 显式创建独立内容并保留 provenance；不随原来源删除，也不静默级联删除用户笔记。
      parameters:
        - $ref: "#/components/parameters/MessageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveNoteRequest"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          minLength: 1
          description: 稳定错误码；客户端按 code 分支，不解析 message。
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          format: uuid
        field_errors:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/FieldError"
        current_version:
          type: integer
          minimum: 1
          description: 409 版本冲突时返回的当前版本。
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    DateValue:
      type: object
      additionalProperties: false
      required:
        - date
        - time
        - timezone
      description: 业务日期。不转换为 UTC 午夜；time 为 null 表示仅有日期。无截止不算逾期，跨日比较按 Asia/Shanghai 的下一日 00:00。
      properties:
        date:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
          description: YYYY-MM-DD。
        time:
          type:
            - string
            - "null"
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:mm；null 表示纯日期，该键必须存在。
        timezone:
          type: string
          const: Asia/Shanghai
    BlockType:
      type: string
      enum:
        - heading
        - paragraph
        - bulletListItem
        - numberedListItem
        - checkListItem
        - image
        - codeBlock
    InlineMark:
      type: string
      enum:
        - bold
        - italic
        - underline
        - strike
        - code
    InlineNode:
      type: object
      additionalProperties: false
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
            - link
        text:
          type: string
        href:
          type: string
          format: uri
        marks:
          type: array
          items:
            $ref: "#/components/schemas/InlineMark"
    NoteBlock:
      type: object
      additionalProperties: false
      required:
        - id
        - type
      description: 白名单笔记块。块 ID 在文档内唯一；最多 5000 块、嵌套 8 层；拒绝可执行 HTML 与任意协议。
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/BlockType"
        level:
          type: integer
          minimum: 1
          maximum: 3
        content:
          type: array
          items:
            $ref: "#/components/schemas/InlineNode"
        asset_id:
          type: string
          format: uuid
        language:
          type: string
        checked:
          type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/NoteBlock"
          description: 嵌套子块；服务端限制总深度不超过 8 层。
    NoteDocument:
      type: object
      additionalProperties: false
      required:
        - blocks
      description: 保存格式 JSON，最大 2 MiB；仅接受白名单块与 inline 节点，服务端按 fixture 校验而非信任编辑器。
      properties:
        blocks:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/NoteBlock"
    Note:
      type: object
      additionalProperties: false
      required:
        - id
        - parent_id
        - title
        - document
        - format_version
        - content_version
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        title:
          type: string
        document:
          $ref: "#/components/schemas/NoteDocument"
        format_version:
          type: integer
          const: 1
        content_version:
          type: integer
          minimum: 1
          description: 语义内容版本，同时作为 ETag 与 expected_version；每次内容变化递增。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    NoteCreate:
      type: object
      additionalProperties: false
      required:
        - title
        - document
      properties:
        title:
          type: string
          maxLength: 500
        parent_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          description: 省略或 null 表示根节点。
        document:
          $ref: "#/components/schemas/NoteDocument"
    NoteUpdate:
      type: object
      additionalProperties: false
      required:
        - expected_version
      minProperties: 2
      properties:
        expected_version:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 500
        document:
          $ref: "#/components/schemas/NoteDocument"
    NotePage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        next_cursor:
          type:
            - string
            - "null"
    NoteMoveRequest:
      type: object
      additionalProperties: false
      required:
        - parent_id
        - position
        - expected_version
      properties:
        parent_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
          description: null 表示移动到根层级。
        position:
          type: integer
          minimum: 0
        expected_version:
          type: integer
          minimum: 1
    RestoreParent:
      type: object
      additionalProperties: false
      required:
        - parent_id
      properties:
        parent_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
    NoteRestoreRequest:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
        restore_parent:
          $ref: "#/components/schemas/RestoreParent"
          description: 省略时保留原父；显式 null 的 parent_id 表示移根。
    Snapshot:
      type: object
      additionalProperties: false
      required:
        - snapshot_id
        - note_id
        - content_version
        - title
        - document
        - reason
        - created_at
      properties:
        snapshot_id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
        content_version:
          type: integer
          minimum: 1
        title:
          type: string
        document:
          $ref: "#/components/schemas/NoteDocument"
        reason:
          type: string
          minLength: 1
          description: 生成原因，例如定时历史、离开 flush 或恢复前保存。
        created_at:
          type: string
          format: date-time
    SnapshotPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Snapshot"
        next_cursor:
          type:
            - string
            - "null"
    SnapshotRestoreRequest:
      type: object
      additionalProperties: false
      required:
        - expected_version
      properties:
        expected_version:
          type: integer
          minimum: 1
    WebAuthnOptions:
      type: object
      additionalProperties: true
      description: webauthn-rs 生成的浏览器 WebAuthn JSON；字段集合随规范演进，本契约不重复定义。
    WebAuthnCredential:
      type: object
      additionalProperties: false
      required:
        - id
        - rawId
        - type
        - response
      properties:
        id:
          type: string
          minLength: 1
        rawId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - public-key
        response:
          type: object
          additionalProperties: true
          description: 注册或断言响应体，由浏览器 WebAuthn 规范定义。
    CeremonyOptions:
      type: object
      additionalProperties: false
      required:
        - ceremony_id
        - options
      properties:
        ceremony_id:
          type: string
          format: uuid
        options:
          $ref: "#/components/schemas/WebAuthnOptions"
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - id
        - user_id
        - created_at
        - last_seen_at
        - idle_expires_at
        - absolute_expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    AuthSessionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthSession"
        next_cursor:
          type:
            - string
            - "null"
    AuthenticationResult:
      type: object
      additionalProperties: false
      required:
        - session
        - csrf_token
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        csrf_token:
          type: string
          minLength: 16
    PasskeyTransport:
      type: string
      enum:
        - usb
        - nfc
        - ble
        - hybrid
        - internal
    Passkey:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - credential_id
        - transports
        - created_at
        - last_used_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        credential_id:
          type: string
          minLength: 1
        transports:
          type: array
          items:
            $ref: "#/components/schemas/PasskeyTransport"
        created_at:
          type: string
          format: date-time
        last_used_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
    PasskeyPage:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
        next_cursor:
          type:
            - string
            - "null"
    BootstrapOptionsRequest:
      type: object
      additionalProperties: false
      required:
        - bootstrap_token
      properties:
        bootstrap_token:
          type: string
          minLength: 1
    BootstrapFinishRequest:
      type: object
      additionalProperties: false
      required:
        - ceremony_id
        - credential
      properties:
        ceremony_id:
          type: string
          format: uuid
        credential:
          $ref: "#/components/schemas/WebAuthnCredential"
        name:
          type: string
          minLength: 1
          maxLength: 100
    RecoveryOptionsRequest:
      type: object
      additionalProperties: false
      required:
        - recovery_token
      properties:
        recovery_token:
          type: string
          minLength: 1
    RecoveryFinishRequest:
      type: object
      additionalProperties: false
      required:
        - recovery_token
        - ceremony_id
        - credential
      properties:
        recovery_token:
          type: string
          minLength: 1
        ceremony_id:
          type: string
          format: uuid
        credential:
          $ref: "#/components/schemas/WebAuthnCredential"
        name:
          type: string
          minLength: 1
          maxLength: 100
    LoginFinishRequest:
