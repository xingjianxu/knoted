      name: q
      in: query
      required: true
      description: 查询词；变化时重置游标。
      schema:
        type: string
        minLength: 1
        maxLength: 500
    SearchTypeParam:
      name: type
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SearchType"
    SearchTagsParam:
      name: tags
      in: query
      required: false
      description: 标签 ID，可重复。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
    SearchProjectParam:
      name: project
      in: query
      required: false
      schema:
        type: string
        format: uuid
    SearchUpdatedFromParam:
      name: updated_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SearchUpdatedToParam:
      name: updated_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    SearchArchivedParam:
      name: archived
      in: query
      required: false
      schema:
        type: boolean
    SearchPathParam:
      name: path
      in: query
      required: false
      schema:
        type: string
    SearchFormatParam:
      name: format
      in: query
      required: false
      schema:
        type: string
    SearchSortParam:
      name: sort
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/SearchSort"
  headers:
    ETag:
      description: 实体当前版本，形如 `"3"`；与响应体版本字段一致。
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: 请求语法或参数无效。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: 未登录或会话已失效。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: 授权失败或 CSRF/Origin 校验失败。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: 对象不存在。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: 版本或状态冲突；version 冲突时带 current_version。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: 请求或文件超过大小/页数/像素限额。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: 业务字段无效，详见 field_errors。
      headers: {}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: 准入受限。
      headers:
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ServiceUnavailable:
      description: 依赖不可用。
      headers:
        Retry-After:
          description: 建议重试等待秒数。
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
