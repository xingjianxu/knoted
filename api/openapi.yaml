        source_id:
          type: string
          format: uuid
        target_type:
          $ref: "#/components/schemas/EntityEndType"
        target_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    EntityLinkCreate:
      type: object
      additionalProperties: false
      required:
        - source_type
        - source_id
        - target_type
        - target_id
      properties:
        source_type:
          $ref: "#/components/schemas/EntityEndType"
        source_id:
          type: string
          format: uuid
        target_type:
          $ref: "#/components/schemas/EntityEndType"
        target_id:
