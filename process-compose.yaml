# Knoted 测试实例编排（由 @bixlab/pcwrap 管理，控制端口 15600，见 pcwrap.config.json）。
#
# 边界：本编排只管理 Knoted 测试应用（配置渲染、迁移、API、专用 HTTPS 入口）。
# PostgreSQL 角色/库 provisioning、Strata、共享模型根与 ACME 证书由 /etc/nixos 管理，
# 不出现在这里，也不随 `./pc down` 停止。
#
# 运行根是固定提交构建产物（tools/dev/build-artifact.sh 产出，含 REVISION 与 SHA256SUMS），
# 不在编排里做源码构建或热更新。
#
# 常用命令：
#   pnpm pc doctor                      # 自检配置/端口/依赖
#   pnpm pc up -D                       # 后台启动（prepare → migrate → api → https）
#   pnpm pc process list                # 进程状态
#   pnpm pc process restart knoted-api  # 只重启 API（不重跑迁移）
#   pnpm pc process logs knoted-api -n 200
#   pnpm pc process restart knoted-https
#   pnpm pc down                        # 停止本实例全部进程
#
# 改 process-compose.yaml、配置模板或环境变量后需 `down` 再 `up`（prepare 才会重跑）。
# 没有 prod profile：生产实例由 /etc/nixos 声明，本编排不启动它。
version: "0.5"

processes:
  prepare:
    command: "bash tools/dev/pc/service.sh prepare"
    availability:
      restart: "no"

  migrate:
    command: "bash tools/dev/pc/service.sh migrate"
    availability:
      restart: "no"
    depends_on:
      prepare:
        condition: process_completed_successfully

  knoted-api:
    command: "exec bash tools/dev/pc/service.sh api"
    availability:
      restart: "on_failure"
      backoff_seconds: 3
      max_restarts: 5
    depends_on:
      migrate:
        condition: process_completed_successfully
    readiness_probe:
      exec:
        command: "bash tools/dev/pc/service.sh probe-api"
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 3
      failure_threshold: 60

  knoted-https:
    command: "exec bash tools/dev/pc/service.sh https"
    availability:
      restart: "on_failure"
      backoff_seconds: 3
      max_restarts: 5
    depends_on:
      knoted-api:
        condition: process_healthy
    readiness_probe:
      exec:
        command: "bash tools/dev/pc/service.sh probe-https"
      initial_delay_seconds: 1
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
